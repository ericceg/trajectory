name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Verify version alignment
        run: npm run check:versions

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run activity metric tests
        run: npm run test:activity-metrics

      - name: Test production map worker
        run: npm run test:map-worker

      - name: Build frontend
        run: npm run build

  rust-quality:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/install-tauri-linux-deps.sh

      - name: Setup Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Rust regression tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Run rustfmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
